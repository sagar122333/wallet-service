#  Local development.
#
#  Auth runs in stub mode, so any bearer token is accepted - see
#  StubUserManagementClient for the "userId|scope,scope" convention that lets
#  you act as different users from curl without an identity service running.
wallet.auth.mode=stub

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.slice.wallet=DEBUG
#  Uncomment to see bound parameters as well as the statements:
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
