#  ==========================================================================
#  FILL THESE IN
#  ==========================================================================
#  Create the schemas first:
#      CREATE DATABASE wallet;
#      CREATE DATABASE wallet_test;
#
#  Then set the username and password below (or export DB_USER / DB_PASSWORD
#  and leave these alone - the ${VAR:default} form takes the environment
#  variable when it is set and the value after the colon when it is not).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#  ==========================================================================
#  Connection pool
#  ==========================================================================
spring.datasource.hikari.pool-name=wallet-pool
#  The per-wallet row lock means concurrent requests on ONE wallet serialise
#  regardless; pool size buys parallelism ACROSS wallets. Keep it above the
#  worker-thread count so threads block on the row lock - the real contention -
#  rather than starving on "get me a connection".
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.connection-timeout=3000

#  ==========================================================================
#  Application
#  ==========================================================================
spring.application.name=wallet-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

#  ==========================================================================
#  Hibernate / JPA
#  ==========================================================================
#  OFF. With open-in-view on, the persistence context stays open for the whole
#  request, so a lazy association can be touched during JSON serialisation and
#  issue queries from inside the view layer - the classic invisible N+1. Off, a
#  LazyInitializationException tells you at once that data was fetched in the
#  wrong place.
spring.jpa.open-in-view=false

#  Flyway owns the schema. "validate" makes Hibernate check its mappings
#  against the real tables at startup and refuse to boot on drift. "update"
#  would silently ALTER your tables to match whatever the code currently says,
#  which is how a column quietly changes type at 3am.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

#  ==========================================================================
#  Flyway
#  ==========================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#  ==========================================================================
#  Authentication
#  ==========================================================================
#  stub   - no network call; any bearer token is accepted and mapped to a
#           dummy user. Use this for local runs and tests.
#  remote - every request calls the user-management service to validate the
#           token and fetch that user's scopes.
wallet.auth.mode=${AUTH_MODE:stub}
wallet.auth.user-management-url=${USER_MANAGEMENT_URL:http://localhost:9000}
wallet.auth.validate-path=/internal/v1/tokens/validate
#  An introspection call on EVERY request couples our latency and our
#  availability to theirs. A short cache is the standard mitigation: long
#  enough to absorb a burst from one client, short enough that a revoked token
#  stops working quickly.
wallet.auth.cache-ttl=PT60S
wallet.auth.connect-timeout=PT1S
wallet.auth.read-timeout=PT2S

#  ==========================================================================
#  JSON
#  ==========================================================================
#  Reject unknown fields instead of ignoring them. A client that misspells
#  "amountMinor" should be told, not silently given a different request than it
#  thinks it sent.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null

#  ==========================================================================
#  MVC
#  ==========================================================================
spring.mvc.throw-exception-if-no-handler-found=true
#  No static resources in an API. Without this an unmapped path falls through
#  to the resource handler and returns a 404 that skips the error envelope.
spring.web.resources.add-mappings=false

#  ==========================================================================
#  Idempotency
#  ==========================================================================
#  How long a client may still retry and get the original response replayed.
wallet.idempotency.ttl=PT24H
wallet.idempotency.sweep-interval-ms=900000

#  ==========================================================================
#  Actuator
#  ==========================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

#  ==========================================================================
#  Logging
#  ==========================================================================
#  %X{requestId} is the MDC value RequestIdFilter sets, so every line emitted
#  while handling one request carries the same id - which is the whole point of
#  having one.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{32} : %msg%n
logging.level.com.slice.wallet=INFO
logging.level.access=INFO
