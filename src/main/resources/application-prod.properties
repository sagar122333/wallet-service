#  Production overrides.
#
#  The only change to how authentication works: every request is validated
#  against the real user-management service instead of being waved through by
#  the stub. Nothing else in the application changes - the filter, the Caller,
#  the scope checks and the ownership checks are identical.
wallet.auth.mode=remote
wallet.auth.user-management-url=${USER_MANAGEMENT_URL}

#  Never log SQL in production: it is noisy, it is slow, and bound parameters
#  in a payments service are customer data.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.com.slice.wallet=INFO
