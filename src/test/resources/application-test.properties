#  ==========================================================================
#  TESTS RUN AGAINST YOUR REAL LOCAL MySQL, in a schema of their own.
#
#  Create it once:   CREATE DATABASE wallet_test;
#  Then set the username/password below (or export TEST_DB_USER /
#  TEST_DB_PASSWORD).
#
#  Not H2, deliberately: this service depends on MySQL behaviour H2 does not
#  reproduce - SELECT ... FOR UPDATE semantics, InnoDB deadlock detection, and
#  how a unique index treats NULLs. A suite that passes on H2 and fails on
#  MySQL is worse than no suite.
#
#  Flyway builds the schema from src/main/resources/db/migration on the first
#  run, so the tests exercise exactly the DDL production uses. Every test
#  creates its fixtures under a random user id, so runs never collide and
#  nothing has to be truncated between them.
#  ==========================================================================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/wallet_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#  The concurrency tests put 32 threads on one wallet. A default pool of 10
#  would starve them on "get a connection" before they ever reached the row
#  lock, which is not what those tests are trying to measure.
spring.datasource.hikari.maximum-pool-size=40

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

#  No identity service in tests. The stub maps the bearer token straight to a
#  user id and scope set, so a test can act as any user with any scopes.
wallet.auth.mode=stub

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

wallet.idempotency.ttl=PT24H
#  Effectively never during a test run.
wallet.idempotency.sweep-interval-ms=3600000

logging.level.com.slice.wallet=INFO
logging.level.org.springframework.web=WARN
